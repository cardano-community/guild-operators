name: Pre-merge

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test'
        required: true
  pull_request:
    paths:
      - scripts/common-helper-scripts/**
      - scripts/cnode-helper-scripts/**
      - scripts/dingo-helper-scripts/**
      - scripts/amaru-helper-scripts/**
      - scripts/grest-helper-scripts/**
      - files/configs/**
      - files/docker/**
      - files/node-implementations/**
      - files/tests/**
      - .github/workflows/docker_bin.yml
      - .github/workflows/lint.yml
      - .github/workflows/premerge.yml

jobs:
  deployment-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch || github.ref }}
    - name: Test deployment dispatcher
      run: bash files/tests/guild-deploy-dispatcher.sh
    - name: Test alternate deployments
      run: bash files/tests/alternate-deployments.sh
    - name: Test deployment layout
      run: bash files/tests/deployment-layout.sh
    - name: Test Docker deployment dispatch
      run: bash files/tests/docker-deployment.sh
    - name: Test common runtime
      run: bash files/tests/common-runtime.sh
    - name: Characterize CNTools entrypoint
      run: bash files/tests/cntools-entrypoint.sh
    - name: Characterize CNTools menu
      run: bash files/tests/cntools-menu.sh
    - name: Characterize CNTools command vectors
      run: bash files/tests/cntools-command-vectors.sh
    - name: Characterize CNTools library APIs
      run: bash files/tests/cntools-library-api.sh
    - name: Characterize CNTools startup policy
      run: bash files/tests/cntools-startup-policy.sh
    - name: Characterize CNTools persistent artifacts
      run: bash files/tests/cntools-persistent-artifacts.sh
    - name: Test managed Git source provider
      run: bash files/tests/guild-source-provider.sh
    - name: Test deployment source manifest
      run: bash files/tests/guild-source-manifest.sh
    - name: Test CNTools legacy library split contract
      run: bash files/tests/cntools-library-split-contract.sh
    - name: Test CNTools modular payload contract
      run: bash files/tests/cntools-payload-contract.sh
    - name: Test CNTools module registry
      run: bash files/tests/cntools-module-registry.sh
    - name: Test CNTools generation diagnostics
      run: bash files/tests/cntools-generation-diagnostics.sh
    - name: Test CNTools generation lifecycle
      run: bash files/tests/cntools-generation-lifecycle.sh
    - name: Test CNTools configuration contract
      run: bash files/tests/cntools-config-contract.sh
    - name: Test deployment transaction
      run: bash files/tests/guild-deploy-transaction.sh
    - name: Test managed Git source safety
      run: bash files/tests/guild-source-safety.sh
    - name: Test managed Git source locking and interruption cleanup
      run: bash files/tests/guild-source-locking.sh
    - name: Test managed Git source shadow parity
      run: bash files/tests/guild-source-shadow.sh
    - name: Lint managed Git source provider, Docker entrypoints, and tests
      run: |
        shellcheck -S warning -e SC2034,SC2327,SC2328 \
          scripts/cnode-helper-scripts/guild-deploy.sh \
          scripts/common-helper-scripts/lib/deployment.library \
          scripts/common-helper-scripts/lib/env.library \
          scripts/common-helper-scripts/lib/node-api.library \
          scripts/common-helper-scripts/lib/systemd.library \
          scripts/common-helper-scripts/cntools/launcher.sh \
          scripts/common-helper-scripts/cntools/core/bootstrap.sh \
          scripts/common-helper-scripts/cntools/core/config.sh \
          scripts/common-helper-scripts/cntools/core/context.sh \
          scripts/common-helper-scripts/cntools/core/dispatcher.sh \
          scripts/common-helper-scripts/cntools/core/lifecycle.sh \
          scripts/common-helper-scripts/cntools/core/registry.sh \
          scripts/common-helper-scripts/cntools/core/result.sh \
          scripts/common-helper-scripts/cntools/templates/action/action.sh \
          files/docker/node/addons/entrypoint.sh \
          files/docker/node/addons/healthcheck.sh \
          files/docker/node/addons/block_watcher.sh \
          files/tests/docker-deployment.sh \
          files/tests/common-runtime.sh \
          files/tests/cntools-library-split-contract.sh \
          files/tests/cntools-payload-contract.sh \
          files/tests/cntools-module-registry.sh \
          files/tests/cntools-generation-diagnostics.sh \
          files/tests/cntools-generation-lifecycle.sh \
          files/tests/cntools-config-contract.sh \
          files/tests/guild-deploy-transaction.sh \
          files/tests/guild-source-manifest.sh \
          files/tests/guild-source-provider.sh \
          files/tests/guild-source-safety.sh \
          files/tests/guild-source-locking.sh \
          files/tests/guild-source-shadow.sh
        shellcheck -s bash -S warning \
          -e SC2034,SC2086,SC2089,SC2090,SC2230,SC2206,SC2140,SC2059,SC2154 \
          scripts/common-helper-scripts/cntools/libs/legacy/15b90fa18f302a89b7e3d0562c9909aacd06d684080fa28ef1a6a98112a5b47f/*.sh
    - name: Test cnode runtime transaction
      run: bash files/tests/cnode-runtime-transaction.sh
    - name: Test systemd helpers
      run: bash files/tests/systemd-library.sh
    - name: Test component systemd recovery
      run: bash files/tests/component-systemd.sh
    - name: Test Dingo metrics adapter
      run: bash files/tests/dingo-metrics.sh
    - name: Test Amaru metrics adapter
      run: bash files/tests/amaru-metrics.sh
    - name: Validate deployment shell entrypoints
      run: |
        find scripts/common-helper-scripts scripts/cnode-helper-scripts scripts/dingo-helper-scripts scripts/amaru-helper-scripts \
          -type f \( -name '*.sh' -o -name '*.library' -o -name '*.adapter' -o -name 'env' \) \
          -print0 | xargs -0 -n1 bash -n
    - name: Validate deployment metadata
      run: |
        find files/node-implementations files/configs/cnode files/configs/dingo files/configs/amaru scripts/common-helper-scripts/cntools \
          -type f -name '*.json' -print0 | xargs -0 -r -n1 jq -e .

  stage-three-bash-compatibility:
    name: Stage 0-3 / Bash ${{ matrix.bash_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - bash_version: '4.4'
            image: bash:4.4.23-alpine3.22
            patch_version: '4.4.23'
          - bash_version: '5.1'
            image: bash:5.1.16-alpine3.22
            patch_version: '5.1.16'
          - bash_version: '5.2'
            image: bash:5.2.37-alpine3.22
            patch_version: '5.2.37'
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch || github.ref }}
    - name: Run Stage 0-3 compatibility suites
      run: |
        docker run --rm \
          --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
          --workdir /workspace \
          "${{ matrix.image }}" \
          -c '
            set -e
            actual_bash_version="${BASH_VERSION%%(*}"
            test "${actual_bash_version}" = "${{ matrix.patch_version }}"
            apk add --no-cache coreutils diffutils findutils gawk git grep jq python3 sed sqlite tar util-linux-misc
            for test_script in \
              files/tests/cntools-entrypoint.sh \
              files/tests/cntools-menu.sh \
              files/tests/cntools-command-vectors.sh \
              files/tests/cntools-library-api.sh \
              files/tests/cntools-startup-policy.sh \
              files/tests/cntools-persistent-artifacts.sh \
              files/tests/guild-deploy-dispatcher.sh \
              files/tests/common-runtime.sh \
              files/tests/docker-deployment.sh \
              files/tests/guild-source-provider.sh \
              files/tests/guild-source-manifest.sh \
              files/tests/cntools-library-split-contract.sh \
              files/tests/cntools-payload-contract.sh \
              files/tests/cntools-module-registry.sh \
              files/tests/cntools-generation-diagnostics.sh \
              files/tests/cntools-generation-lifecycle.sh \
              files/tests/cntools-config-contract.sh \
              files/tests/guild-deploy-transaction.sh \
              files/tests/guild-source-safety.sh \
              files/tests/guild-source-locking.sh \
              files/tests/guild-source-shadow.sh
            do
              bash "${test_script}"
            done
          '

  docker-node-smoke:
    name: Docker node image smoke build
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_ACCOUNT: ${{ github.event.pull_request.head.repo.owner.login }}
      SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}
    steps:
    - uses: actions/checkout@v4
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Build pinned Dingo testnet image without publishing
      run: |
        docker build . \
          --file files/docker/node/dockerfile_bin \
          --build-arg "G_ACCOUNT=${SOURCE_ACCOUNT}" \
          --build-arg "GUILD_DEPLOY_BRANCH=${SOURCE_BRANCH}" \
          --build-arg "GUILD_DEPLOY_REVISION=${SOURCE_REVISION}" \
          --build-arg NODE_IMPLEMENTATION=dingo \
          --build-arg NODE_NETWORK=preprod \
          --tag "guild-operators-pr-smoke:${SOURCE_REVISION}"

  guild-deploy-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64] # [linux/amd64,linux/arm64]
        distro: [ubuntu, rockylinux]
    env:
      REGISTRY: ghcr.io
      BRANCH: ${{ github.event.inputs.branch || github.head_ref }}
    if: github.event.pull_request.draft == false
    steps:
    - name: Free Disk Space with Analysis
      uses: LizardByte/actions/actions/more_space@master
      with:
        analyze-space-savings: true
        clean-all: true
        safe-packages: "jq,git"
    - name: Provide additional free space
      run: |
        # Workaround to provide additional free space for builds
        #   https://github.com/actions/virtual-environments/issues/2840
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
        df -h
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch || github.ref }}
    - name: Define BRANCH, COMMIT_SHA and G_ACCOUNT in environment
      run: |
        echo "IS_FORK=${{ github.event.pull_request.head.repo.fork }}" >> $GITHUB_ENV
        echo "FORK_OWNER=${{ github.event.pull_request.head.repo.owner.login }}" >> $GITHUB_ENV
        echo "G_ACCOUNT=${{ github.repository_owner }}" >> $GITHUB_ENV
        echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: Setup G_ACCOUNT based on fork status
      run: |
        if [ "$IS_FORK" = "true" ]; then
          echo "This means the PR is from a fork"
          echo "BUILD_G_ACCOUNT=${{ github.event.pull_request.head.repo.owner.login }}" >> $GITHUB_ENV
        else
          echo "This means the PR is from the same repository"
          echo "BUILD_G_ACCOUNT=${{ github.repository_owner }}" >> $GITHUB_ENV
        fi
    - name: Testing guild-deploy.sh (with libsodium)
      run: |
        docker build . \
          --progress=plain \
          --file files/tests/pre-merge/${{ matrix.distro }}-guild-deploy.sh.containerfile \
          --compress \
          --build-arg BRANCH=$BRANCH \
          --build-arg COMMIT=$COMMIT_SHA \
          --build-arg G_ACCOUNT=${{ env.BUILD_G_ACCOUNT }} \
          --tag $REGISTRY/${{ env.G_ACCOUNT }}/pre-merge-${{ matrix.distro }}:guild-deploy-l_$COMMIT_SHA
    - name: Get Image ID
      run: |
        PREMERGE_IMAGE_ID1=$(docker inspect ${{ env.REGISTRY }}/${{ env.G_ACCOUNT }}/pre-merge-${{ matrix.distro }}:guild-deploy-l_${{ env.COMMIT_SHA }} --format='{{.Id}}')
        echo "PREMERGE_IMAGE_ID1=${PREMERGE_IMAGE_ID1}" >> $GITHUB_ENV
    - name: Push pre-merge-${{ matrix.distro }}:guild-deploy-l_${{ env.COMMIT_SHA }}
      run: |
        docker push ${{ env.REGISTRY }}/${{ env.G_ACCOUNT }}/pre-merge-${{ matrix.distro }}:guild-deploy-l_${{ env.COMMIT_SHA }}
    - name: Testing cabal-build-all.sh (with libsodium)
      run: |
        echo "Working from PR Branch ${{ env.G_ACCOUNT }}/guild-operators/${{ env.BRANCH }} on COMMIT_SHA ${{ env.COMMIT_SHA }}"
        docker build . \
          --progress=plain \
          --file files/tests/pre-merge/${{ matrix.distro }}-cabal.containerfile \
          --compress \
          --build-arg BRANCH=${{ env.BRANCH }} \
          --build-arg COMMIT=${{ env.COMMIT_SHA }} \
          --build-arg G_ACCOUNT=${{ env.BUILD_G_ACCOUNT }} \
          --tag ${{ env.REGISTRY }}/${{ env.G_ACCOUNT }}/pre-merge-${{ matrix.distro }}:cabal_${{ env.COMMIT_SHA }}
    - name: Get Versions and Image ID
      run: |
        VERSION_DETAILS=($(docker run --rm ${{ env.REGISTRY }}/${{ env.G_ACCOUNT }}/pre-merge-${{ matrix.distro }}:cabal_${{ env.COMMIT_SHA }} cardano-node --version | awk '/^cardano-node/'))
        PREMERGE_IMAGE_ID2=$(docker inspect ${{ env.REGISTRY }}/${{ env.G_ACCOUNT }}/pre-merge-${{ matrix.distro }}:cabal_${{ env.COMMIT_SHA }} --format='{{.Id}}')
        echo "CARDANO_NODE_VERSION=${VERSION_DETAILS[1]}" >> $GITHUB_ENV
        echo "GHC_VERSION=${VERSION_DETAILS[5]}" >> $GITHUB_ENV
        echo "PREMERGE_IMAGE_ID2=${PREMERGE_IMAGE_ID2}" >> $GITHUB_ENV
    - name: Push pre-merge-${{ matrix.distro }}:cabal_${{ env.COMMIT_SHA }}
      run: |
        docker push ${{ env.REGISTRY }}/${{ env.G_ACCOUNT }}/pre-merge-${{ matrix.distro }}:cabal_${{ env.COMMIT_SHA }}
    - name: Add summary details
      if: always()
      run: |
        echo "## Pre-Merge Summary Details" >> $GITHUB_STEP_SUMMARY
        echo "| Name | Value |" >> $GITHUB_STEP_SUMMARY
        echo "| ---- | ----- |" >> $GITHUB_STEP_SUMMARY
        echo "| Guild Deploy Image | ${{ env.REGISTRY }}/${{ env.G_ACCOUNT }}/pre-merge-${{ matrix.distro }}:guild-deploy-l_${{ env.COMMIT_SHA }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Guild Deploy Image ID | ${{ env.PREMERGE_IMAGE_ID1 }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Cabal Build Image | ${{ env.REGISTRY }}/${{ env.G_ACCOUNT }}/pre-merge-${{ matrix.distro }}:cabal_${{ env.COMMIT_SHA }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Cabal Build Image ID | ${{ env.PREMERGE_IMAGE_ID2 }} |" >> $GITHUB_STEP_SUMMARY
        echo "| G_ACCOUNT | ${{ env.G_ACCOUNT }} |" >> $GITHUB_STEP_SUMMARY
        echo "| BRANCH | ${{ env.BRANCH }} |" >> $GITHUB_STEP_SUMMARY
        echo "| COMMIT_SHA | ${{ env.COMMIT_SHA }} |" >> $GITHUB_STEP_SUMMARY
        echo "| CARDANO_NODE_VERSION | ${{ env.CARDANO_NODE_VERSION }} |" >> $GITHUB_STEP_SUMMARY
        echo "| GHC_VERSION | ${{ env.GHC_VERSION }} |" >> $GITHUB_STEP_SUMMARY
