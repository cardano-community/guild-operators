name: SH Linter

on:
#  push:
#    branches: [ '*' ]
#     branches: [ master,alpha ]
  pull_request:
    branches: [ '*' ]

jobs:
  shlint:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v4
    - name: SH Lint Check
      uses: ludeeus/action-shellcheck@master
      env:
        SHELLCHECK_OPTS: -e SC2089 -e SC2090 -e SC2034 -e SC2327 -e SC2328
      with:
        scandir: "./scripts"
        severity: "warning"
        ignore_paths: >-
          scripts/common-helper-scripts/cntools/libs/legacy
        additional_files: >-
          env
          cntools.library
          mithril.library
          deployment.library
          env.library
          node-api.library
          systemd.library
    - name: Docker and Stage 3 shell lint check
      run: |
        shellcheck -S warning -e SC2034,SC2327,SC2328 \
          files/docker/node/addons/entrypoint.sh \
          files/docker/node/addons/healthcheck.sh \
          files/docker/node/addons/block_watcher.sh \
          files/tests/docker-deployment.sh \
          files/tests/common-runtime.sh \
          files/tests/cntools-library-split-contract.sh \
          files/tests/cntools-payload-contract.sh \
          files/tests/cntools-module-registry.sh \
          files/tests/cntools-compatibility-runner.sh \
          files/tests/cntools-asset-list-characterization.sh \
          files/tests/cntools-generation-diagnostics.sh \
          files/tests/cntools-generation-lifecycle.sh \
          files/tests/cntools-config-contract.sh \
          files/tests/guild-deploy-transaction.sh \
          files/tests/guild-source-manifest.sh
        shellcheck -s bash -S warning \
          -e SC2034,SC2086,SC2089,SC2090,SC2230,SC2206,SC2140,SC2059,SC2154 \
          scripts/common-helper-scripts/cntools/libs/legacy/6e40118f106169924a372a9d98fbc946cfc5362fcd1cd5a3ff048ae9287d5d59/*.sh
    - name: Deployment dispatcher tests
      run: bash files/tests/guild-deploy-dispatcher.sh
    - name: Deployment source manifest tests
      run: bash files/tests/guild-source-manifest.sh
    - name: CNTools legacy library split contract tests
      run: bash files/tests/cntools-library-split-contract.sh
    - name: CNTools modular payload contract tests
      run: bash files/tests/cntools-payload-contract.sh
    - name: CNTools module registry tests
      run: bash files/tests/cntools-module-registry.sh
    - name: CNTools compatibility runner tests
      run: bash files/tests/cntools-compatibility-runner.sh
    - name: CNTools advanced asset list action tests
      run: bash files/tests/cntools-asset-list-characterization.sh
    - name: CNTools generation diagnostic tests
      run: bash files/tests/cntools-generation-diagnostics.sh
    - name: CNTools generation lifecycle tests
      run: bash files/tests/cntools-generation-lifecycle.sh
    - name: CNTools configuration contract tests
      run: bash files/tests/cntools-config-contract.sh
    - name: Deployment transaction tests
      run: bash files/tests/guild-deploy-transaction.sh
    - name: Alternate deployment tests
      run: bash files/tests/alternate-deployments.sh
    - name: Deployment layout tests
      run: bash files/tests/deployment-layout.sh
    - name: Docker deployment tests
      run: bash files/tests/docker-deployment.sh
    - name: Common runtime tests
      run: bash files/tests/common-runtime.sh
    - name: Cnode runtime transaction tests
      run: bash files/tests/cnode-runtime-transaction.sh
    - name: Systemd helper tests
      run: bash files/tests/systemd-library.sh
    - name: Component systemd recovery tests
      run: bash files/tests/component-systemd.sh
    - name: Dingo metrics adapter tests
      run: bash files/tests/dingo-metrics.sh
    - name: Amaru metrics adapter tests
      run: bash files/tests/amaru-metrics.sh
  jsonlint:
    name: JSON and YAML Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: JSON/YAML Validate
      uses: GrantBirki/json-yaml-validate@v3.2.1
