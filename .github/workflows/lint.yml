name: SH Linter

on:
#  push:
#    branches: [ '*' ]
#     branches: [ master,alpha ]
  pull_request:
    branches: [ '*' ]

jobs:
  shlint:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v4
    - name: SH Lint Check
      uses: ludeeus/action-shellcheck@master
      env:
        SHELLCHECK_OPTS: -e SC2089 -e SC2090 -e SC2034 -e SC2327 -e SC2328
      with:
        scandir: "./scripts"
        severity: "warning"
        additional_files: "./scripts/common-helper-scripts/env, ./scripts/cnode-helper-scripts/mithril.library"
    - name: Deployment dispatcher tests
      run: bash files/tests/guild-deploy-dispatcher.sh
    - name: Alternate deployment tests
      run: bash files/tests/alternate-deployments.sh
    - name: Deployment layout tests
      run: bash files/tests/deployment-layout.sh
    - name: Docker deployment tests
      run: bash files/tests/docker-deployment.sh
    - name: Common runtime tests
      run: bash files/tests/common-runtime.sh
    - name: Cnode runtime transaction tests
      run: bash files/tests/cnode-runtime-transaction.sh
    - name: Systemd helper tests
      run: bash files/tests/systemd-library.sh
    - name: Component systemd recovery tests
      run: bash files/tests/component-systemd.sh
    - name: Cnode metrics adapter tests
      run: bash files/tests/cnode-metrics.sh
    - name: gLiveView peer analysis tests
      run: bash files/tests/gliveview-peer-analysis.sh
    - name: gLiveView pool data tests
      run: bash files/tests/gliveview-pool.sh
    - name: Dingo metrics adapter tests
      run: bash files/tests/dingo-metrics.sh
    - name: Amaru metrics adapter tests
      run: bash files/tests/amaru-metrics.sh
    - name: Amaru leaderlog tests
      run: bash files/tests/amaru-leaderlog.sh
    - name: gLiveView view tests
      run: bash files/tests/gliveview-views.sh
    - name: gLiveView notice tests
      run: bash files/tests/gliveview-notices.sh
    - name: Block validation tests
      run: bash files/tests/block-validation.sh
    - name: CNTools Dijkstra tests
      run: bash files/tests/cntools-dijkstra.sh
    - name: CNTools shortcut tests
      run: bash files/tests/cntools-shortcuts.sh
    - name: CNTools picker tests
      run: bash files/tests/cntools-pickers.sh
    - name: CNTools KES reload hint tests
      run: bash files/tests/cntools-kes-reload-hint.sh
    - name: CNTools KES period tests
      run: bash files/tests/cntools-kes-period.sh
    - name: CNTools fzf picker tests
      run: bash files/tests/cntools-fzf-picker.sh
  jsonlint:
    name: JSON and YAML Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: JSON/YAML Validate
      uses: GrantBirki/json-yaml-validate@v3.2.1
