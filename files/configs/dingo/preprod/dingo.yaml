# Guild Operators Dingo profile: preprod
# The launcher overrides blockProducer when a complete POOL_DIR is available.
network: "preprod"
databasePath: "@NODE_HOME@/db"
socketPath: "@NODE_HOME@/sockets/dingo.socket"
bindAddr: "0.0.0.0"
relayPort: "@NODE_PORT@"
privateBindAddr: "127.0.0.1"
privatePort: 3002
metricsPort: 12798
debugPort: 0
storageMode: "core"
runMode: "serve"
blockProducer: false
shutdownTimeout: "30s"
logging:
  format: "text"
  level: "info"
